<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TableTap | Restaurant Management System Demo by Habibullah</title>
<meta name="description" content="A restaurant management demo with table status, order taking, automatic bill with GST and daily sales. Built with HTML, CSS and JavaScript by Habibullah Ansari.">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#1a100b">
<link rel="stylesheet" href="css/style.css">

<body>
<header><div><h1>Table<span>Tap</span></h1><p>Pick a table, add dishes and print the bill. Sample menu loaded.</p></div><div class="sales"><small>Today’s sales</small><b id="sl">₹0</b></div></header>
<main class="layout">
 <section class="card"><h2>Tables</h2><div class="tables" id="tb"></div><p class="muted" style="font-size:.85rem;margin-bottom:0">Green is free, orange has an open order.</p></section>
 <section class="card" aria-live="polite"><h2 id="ot">Select a table</h2><div id="mn" class="menu"></div><div id="ol"></div><div class="tot" id="tt"></div><button class="btn" id="pay" disabled>Generate bill and free table</button><div id="msg" role="status"></div></section>
</main>
<footer>Demo project by <a href="../../index.html">Habibullah Ansari</a>. Data is saved in this browser only.</footer>
<script src="js/script.js" defer></script>
</body>
