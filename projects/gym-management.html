<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IronFit | Gym Management System Demo by Habibullah</title>
<meta name="description" content="A gym management demo to add members, choose plans, track expiry dates, check members in and see monthly revenue. Built with HTML, CSS and JavaScript by Habibullah Ansari.">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#0c0c0d">
<style>
:root{--bg:#0c0c0d;--surface:#161618;--line:#2a2a2e;--text:#f5f5f5;--muted:#a1a1aa;--accent:#ff4d2e;--accent2:#ff9f1c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 1rem/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header,main{max-width:1150px;margin:auto;padding:0 5vw}
header{padding-top:26px}
h1{margin:0;font-size:clamp(1.6rem,4vw,2.3rem);letter-spacing:-.02em}
h1 span{background:linear-gradient(120deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:2px 0 18px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.k small{color:var(--muted)}
.k b{display:block;font-size:1.7rem;letter-spacing:-.02em}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 20px;cursor:pointer}
.tabs button[aria-selected=true]{background:linear-gradient(120deg,var(--accent),var(--accent2));color:#170a06;border:0;font-weight:700}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
input,select{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 13px}
.bar input[type=search]{flex:1;min-width:180px}
.btn{background:linear-gradient(120deg,var(--accent),var(--accent2));color:#170a06;border:0;border-radius:12px;padding:10px 18px;font-weight:700;cursor:pointer}
.sm{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 11px;cursor:pointer;font-size:.85rem}
.sm:hover{border-color:var(--accent)}
.sm:disabled{opacity:.4;cursor:not-allowed}
#add{display:none;margin-bottom:16px}
#add.on{display:block}
#add form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end}
#add label{font-size:.85rem;color:var(--muted);display:grid;gap:4px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);font-size:.93rem}
th{color:var(--muted);font-weight:600}
.b{padding:2px 10px;border-radius:99px;font-size:.78rem;border:1px solid currentColor}
.Active{color:#4cd9a0}.Expiring{color:#ffb74d}.Expired{color:#ff6b81}
td .sm+.sm{margin-left:4px}
.none{text-align:center;color:var(--muted);padding:26px}
#msg{min-height:1.5em;color:var(--accent2);margin:6px 0;font-weight:600}
footer{text-align:center;color:var(--muted);padding:26px 5vw;border-top:1px solid var(--line);margin-top:40px;font-size:.9rem}
footer a{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><h1>Iron<span>Fit</span> Manager</h1><p>Manage members, plans and daily check-ins in one place. Sample data is loaded.</p></header>
<main>
<div class="kpis" id="k" aria-live="polite"></div>
<div class="tabs" role="tablist"><button role="tab" data-t="m" aria-selected="true">Members</button><button role="tab" data-t="c" aria-selected="false">Today’s check-ins</button></div>
<div id="msg" role="status"></div>
<section id="pm">
 <div class="bar"><input type="search" id="q" placeholder="Search members" aria-label="Search members"><select id="fl" aria-label="Filter by status"><option>All</option><option>Active</option><option>Expiring</option><option>Expired</option></select><button class="btn" id="tg">+ Add member</button></div>
 <div class="card" id="add"><form id="f"><label>Name<input id="nm" required maxlength="40"></label><label>Phone<input id="ph" inputmode="numeric" maxlength="10" pattern="[0-9]{10}" placeholder="10 digits" required></label><label>Plan<select id="pl"></select></label><button class="btn" type="submit">Save member</button></form></div>
 <div class="card tw"><table><thead><tr><th>Member</th><th>Plan</th><th>Expires</th><th>Status</th><th>Actions</th></tr></thead><tbody id="tb"></tbody></table></div>
</section>
<section id="pc" hidden><div class="card tw"><table><thead><tr><th>Time</th><th>Member</th><th>Plan</th></tr></thead><tbody id="ci"></tbody></table></div></section>
</main>
<footer>Demo project by <a href="../index.html">Habibullah Ansari</a>. Data is saved in this browser only.</footer>
<script>
(function(){
var PL={"Monthly":[1,1000],"Quarterly":[3,2700],"Yearly":[12,9600]};
var $=function(x){return document.getElementById(x)},R=function(v){return "₹"+v.toLocaleString("en-IN")};
function add(d,m){var x=new Date(d);x.setMonth(x.getMonth()+m);return x}
function iso(d){return d.toISOString().slice(0,10)}
function nice(s){return new Date(s).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"})}
var today=iso(new Date()),S;
try{S=JSON.parse(localStorage.getItem("gym")||"null")}catch(e){}
if(!S){S={m:[{id:1,n:"Aarav Shah",ph:"9876500011",p:"Monthly",s:today,e:iso(new Date(Date.now()+12*864e5)),paid:1000},{id:2,n:"Priya Patel",ph:"9876500022",p:"Yearly",s:today,e:iso(add(today,10)),paid:9600},{id:3,n:"Rahul Mehta",ph:"9876500033",p:"Quarterly",s:today,e:iso(new Date(Date.now()+3*864e5)),paid:2700},{id:4,n:"Sana Khan",ph:"9876500044",p:"Monthly",s:today,e:iso(new Date(Date.now()-5*864e5)),paid:1000}],c:[],id:5}}
function save(){try{localStorage.setItem("gym",JSON.stringify(S))}catch(e){}}
function st(m){var d=(new Date(m.e)-new Date(today))/864e5;return d<0?"Expired":d<=7?"Expiring":"Active"}
$("pl").innerHTML=Object.keys(PL).map(function(k){return "<option value=\""+k+"\">"+k+" ("+R(PL[k][1])+")</option>"}).join("");
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function draw(){
 var q=$("q").value.toLowerCase(),f=$("fl").value,a=0,x=0,r=0;
 S.m.forEach(function(m){var s=st(m);if(s==="Active")a++;if(s==="Expiring")x++;r+=m.paid});
 $("k").innerHTML=[["Total members",S.m.length],["Active",a],["Expiring in 7 days",x],["Revenue collected",R(r)]].map(function(k){return '<div class="card k"><small>'+k[0]+'</small><b>'+k[1]+'</b></div>'}).join("");
 var L=S.m.filter(function(m){return m.n.toLowerCase().indexOf(q)>-1&&(f==="All"||st(m)===f)});
 $("tb").innerHTML=L.length?L.map(function(m){var s=st(m);return '<tr><td><b>'+esc(m.n)+'</b><br><small style="color:var(--muted)">'+m.ph+'</small></td><td>'+m.p+'</td><td>'+nice(m.e)+'</td><td><span class="b '+s+'">'+s+'</span></td><td><button class="sm" data-ci="'+m.id+'"'+(s==="Expired"?' disabled':'')+'>Check in</button><button class="sm" data-rn="'+m.id+'">Renew</button><button class="sm" data-dl="'+m.id+'" aria-label="Delete '+esc(m.n)+'">✕</button></td></tr>'}).join(""):'<tr><td colspan="5" class="none">No members found.</td></tr>';
 var C=S.c.filter(function(c){return c.d===today});
 $("ci").innerHTML=C.length?C.map(function(c){return '<tr><td>'+c.t+'</td><td>'+esc(c.n)+'</td><td>'+c.p+'</td></tr>'}).join(""):'<tr><td colspan="3" class="none">No check-ins yet today.</td></tr>';
 save()}
function msg(t){$("msg").textContent=t;setTimeout(function(){$("msg").textContent=""},3000)}
function get(id){return S.m.filter(function(m){return m.id==id})[0]}
document.addEventListener("click",function(e){var t=e.target,m;
 if(t.dataset.ci&&(m=get(t.dataset.ci))){if(S.c.some(function(c){return c.d===today&&c.mid===m.id}))return msg(m.n+" is already checked in today.");S.c.push({d:today,t:new Date().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"}),n:m.n,p:m.p,mid:m.id});msg(m.n+" checked in.");draw()}
 if(t.dataset.rn&&(m=get(t.dataset.rn))){var b=new Date(m.e)>new Date(today)?m.e:today;m.e=iso(add(b,PL[m.p][0]));m.paid+=PL[m.p][1];msg(m.n+" renewed until "+nice(m.e)+".");draw()}
 if(t.dataset.dl){S.m=S.m.filter(function(x){return x.id!=t.dataset.dl});draw()}
 if(t.dataset.t){document.querySelectorAll(".tabs button").forEach(function(b){b.setAttribute("aria-selected",b===t)});$("pm").hidden=t.dataset.t!=="m";$("pc").hidden=t.dataset.t!=="c"}});
$("tg").onclick=function(){$("add").classList.toggle("on")};
$("q").oninput=$("fl").onchange=draw;
$("f").onsubmit=function(e){e.preventDefault();var p=$("pl").value;S.m.unshift({id:S.id++,n:$("nm").value.trim(),ph:$("ph").value,p:p,s:today,e:iso(add(today,PL[p][0])),paid:PL[p][1]});e.target.reset();$("add").classList.remove("on");msg("Member added.");draw()};
draw();
})();
</script>
</body>
</html>
